name: Build adblock module

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build adblock module
        run: python3 scripts/build_adblock.py
      - name: Commit and push updated module
        run: |
          if [ -n "$(git status --porcelain adblock.sgmodule)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
            git add adblock.sgmodule
            git commit -m "chore: update adblock.sgmodule"
            git push
          fi
